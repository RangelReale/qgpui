# Publishes a GitHub release when a version tag is pushed, such as v1.0.0. The tag must match the
# version in CMakeLists.txt's project() call. The release holds the Windows installer and the
# macOS disk image, which both include a catalog built from QuestPorts at release time, and that
# catalog on its own (decisions 0019 and 0022).
#
# The build jobs hold no secrets. A separate macOS job signs the finished bundle with the
# Developer ID and notarizes the disk image, with the secrets of the environment "release"; it
# runs nothing from the build. To make a release again, run this workflow by hand from its tag,
# under "Use workflow from".
name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Check the version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against the project version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^project\(qgpui VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the project version $version in CMakeLists.txt."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  catalog:
    name: Build the catalog
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/questports-payload/package-lock.json

      - name: Build the catalog
        working-directory: tools/questports-payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build-payload
          npm run build-catalog

      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: local/qgpui-catalog.json
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build the Windows installer
    needs: [prepare, catalog]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: catalog
          path: local

      - uses: ./.github/actions/setup-windows-build

      - name: Configure
        run: cmake --preset windows-ninja -DQGPUI_DEV_CATALOG=OFF "-DQGPUI_PLATFORM_TOOLS=$env:QGPUI_PLATFORM_TOOLS"

      - name: Build
        run: cmake --build --preset windows-ninja

      - name: Test
        run: ctest --preset windows-ninja

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the installer
        run: packaging/windows/build-installer.ps1 -BuildDir build/windows-ninja -Catalog local/qgpui-catalog.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/qgpui-*-setup.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build the macOS app
    needs: [prepare, catalog]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: catalog
          path: local

      - uses: ./.github/actions/setup-macos-build

      # Universal, for Apple silicon and Intel.
      - name: Configure
        run: >
          cmake --preset macos -DQGPUI_DEV_CATALOG=OFF
          "-DQGPUI_PLATFORM_TOOLS=$QGPUI_PLATFORM_TOOLS" "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build --preset macos

      - name: Test
        run: ctest --preset macos

      # Unsigned here; the signing job signs it. A zip would lose the symbolic links inside Qt's
      # frameworks, so the bundle travels as a tar file.
      - name: Deploy the app with the catalog
        run: |
          sh packaging/macos/deploy-macos.sh "$QGPUI_MACDEPLOYQT" build/macos/bin/Release/qgpui.app \
            build/macos/release/QGPUI.app local/qgpui-catalog.json
          tar -cf build/macos/macos-bundle.tar -C build/macos/release QGPUI.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: build/macos/macos-bundle.tar
          if-no-files-found: error
          retention-days: 1

  # Runs nothing from the build and reads no cache, so nothing the build ran can reach the
  # certificate. The bundle is data here.
  sign-macos:
    name: Sign and notarize the macOS app
    needs: [prepare, macos]
    runs-on: macos-15
    environment: release
    env:
      DMG: qgpui-${{ needs.prepare.outputs.version }}-macos.dmg
      IDENTITY: Developer ID Application
    steps:
      # Pinned to commits: this job holds the signing secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bundle
          path: bundle

      - name: Unpack the bundle
        run: tar -xf bundle/macos-bundle.tar -C bundle

      - name: Check the signing secrets
        env:
          HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_NOTARY_KEY: ${{ secrets.NOTARY_API_KEY != '' }}
        run: |
          if [ "$HAS_CERTIFICATE" != true ] || [ "$HAS_NOTARY_KEY" != true ]; then
            echo "::error::The environment \"release\" lacks the Developer ID secrets, so the app cannot be notarized. See DEVELOPMENT.md#ci-and-releases."
            exit 1
          fi

      # A keychain of its own, with a random password, holds the Developer ID certificate for this
      # job only. The last step deletes it.
      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          umask 077
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # The existing keychains, one word each, follow the new one.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

      - name: Sign the app and make the disk image
        run: |
          sh packaging/macos/sign-macos.sh bundle/QGPUI.app "$IDENTITY"
          sh packaging/macos/package-macos.sh bundle/QGPUI.app "$DMG"

      - name: Notarize the disk image
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          QGPUI_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          QGPUI_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          QGPUI_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_API_KEY" > "$QGPUI_NOTARY_KEY"
          sh packaging/macos/notarise-macos.sh "$DMG" "$IDENTITY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

  publish:
    name: Publish the release
    needs: [prepare, windows, sign-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Every artifact of the run, including the unsigned bundle; only the three files below go up.
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -l dist
          for file in "qgpui-$VERSION-setup.exe" "qgpui-$VERSION-macos.dmg" qgpui-catalog.json; do
            [ -f "dist/$file" ] || { echo "::error::The release has no $file."; exit 1; }
          done
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "QGPUI $VERSION" --generate-notes
          fi
          gh release upload "$TAG" "dist/qgpui-$VERSION-setup.exe" "dist/qgpui-$VERSION-macos.dmg" \
            dist/qgpui-catalog.json --clobber
