<?xml version="1.0" encoding="UTF-8"?>
<!-- The temporary QGPUI icon for macOS: the design of ../make-icon.ps1 on Apple's icon grid, an
     824-pixel rounded square centred on a 1024-pixel canvas, with a soft shadow below it.
     make-icons.sh renders it into the PNG files beside it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgb(32,120,220)"/>
      <stop offset="1" stop-color="rgb(120,50,200)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#body)" filter="url(#shadow)"/>
  <text x="512" y="512" dy="0.35em" text-anchor="middle" fill="#fff"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold"
        font-size="511">Q</text>
</svg>
